name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard tracked env files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.|/)' || true)"
          tracked_env="$(printf '%s\n' "$tracked_env" | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked .env-like files are not allowed:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Guard obvious secret filenames
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -Ei '(^|/)(gmail|oauth|token|secret|credential|service-account|apikey|api-key).*(\.json|\.txt|\.csv|\.env|\.key|\.pem)$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Potential secret-bearing files must not be tracked:"
            echo "$bad_files"
            exit 1
          fi

      - name: Scan obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          rg -n \
            -g '!package-lock.json' \
            -g '!.env.example' \
            -e 'ghp_[A-Za-z0-9]{36,}' \
            -e 'github_pat_[A-Za-z0-9_]{20,}' \
            -e 'AIza[0-9A-Za-z\-_]{35}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----' \
            . && exit 1 || true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

